name: release

# This workflow publishes the init binary built by scripts/build-init.sh.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (for example v0.1.0)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # To require a second approver, create a "release" environment under
    # Settings -> Environments with required reviewers and uncomment:
    # environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache: true

      - name: resolve source identity
        id: source
        run: |
          commit="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain)"
          if [[ -n "$dirty" ]]; then
            echo "error: release must build from a clean working tree; uncommitted changes:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "verirelay commit: $commit"

      - name: build init binary
        run: ./scripts/build-init.sh "$RUNNER_TEMP/out/verirelay-linux-amd64"

      - name: verify binary and write release metadata
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          bin="$out/verirelay-linux-amd64"

          file "$bin"
          file "$bin" | grep -q 'ELF 64-bit LSB executable, x86-64'
          file "$bin" | grep -q 'statically linked'

          cd "$out"
          sha256sum verirelay-linux-amd64 > SHA256SUMS

          # Extract the toolchain version from the build script instead of
          # asking the host go: the script pins GOTOOLCHAIN, and the host may
          # run a different version that never participated in the build.
          gotoolchain="$(sed -nE 's/^ *GOTOOLCHAIN=([^ ]+) .*/\1/p' \
            "$GITHUB_WORKSPACE/scripts/build-init.sh" | head -1)"
          [[ -n "$gotoolchain" ]] || { echo "error: cannot extract GOTOOLCHAIN from build-init.sh" >&2; exit 1; }
          go_version="$(env GOTOOLCHAIN="$gotoolchain" go version | awk '{print $3}')"

          jq -n \
            --arg commit "${{ steps.source.outputs.commit }}" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$(cut -d' ' -f1 < SHA256SUMS)" \
            --argjson size "$(stat -c %s verirelay-linux-amd64)" \
            --arg go "$go_version" \
            --arg gotoolchain "$gotoolchain" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              version: "verirelay-component-build/1",
              component: "verirelay",
              repository: "https://github.com/verirelay/verirelay",
              commit: $commit,
              release_tag: $tag,
              artifacts: {
                "verirelay-linux-amd64": { sha256: $sha, size: $size }
              },
              toolchain: { go_version: $go, gotoolchain: $gotoolchain },
              build: { runner: "ubuntu-24.04", workflow_run: $run_url }
            }' > verirelay-component-build.json

          cat SHA256SUMS
          cat verirelay-component-build.json

      # --- Provenance ---
      #
      # The primary mechanism is cosign keyless signing (GitHub OIDC -> Fulcio
      # short-lived certificate), which produces <file>.cosign.bundle files
      # distributed with the release; verifiers need no GitHub account.
      # Trade-off: signing writes to the public Rekor log (digest and identity
      # only, not content) and verification requires network access.
      # Native GitHub artifact attestation always runs as well.
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign-installer has no floating v4 tag; pin an exact release.
          cosign-release: 'v3.1.3'

      - name: sign artifacts (keyless)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          for f in verirelay-linux-amd64 SHA256SUMS verirelay-component-build.json; do
            echo "--- signing $f ---"
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done
          ls -l ./*.cosign.bundle

      - name: attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/out/*

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The quoted heredoc keeps Markdown backticks literal; @REPO@ is filled in below.
          notes="$(cat <<'EOF'
          VeriRelay runs in a CVM and issues a Receipt for every forward.

          To deploy it, use the Boot Artifact Set from [verirelay/release](https://github.com/verirelay/release/releases). It builds VeriRelay from source into the initrd and lists the Launch Measurements.

          `verirelay-component-build.json` records the commit, Go toolchain and build run of `verirelay-linux-amd64`.

          ## Verify

          Each file comes with a `.cosign.bundle` from this repository's release workflow:

          ```bash
          cosign verify-blob --bundle <file>.cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/@REPO@/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            <file>
          ```
          EOF
          )"
          notes="${notes//@REPO@/"$GITHUB_REPOSITORY"}"
          printf '%s\n' "$notes" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          # Generated notes append the changelog link after ours.
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --generate-notes \
            "$RUNNER_TEMP"/out/*
